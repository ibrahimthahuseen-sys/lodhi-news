:root{
  --plum:#4a1a5c; --wine:#8c1d3f; --ink:#1d1a22; --mute:#7b7683; --line:#e4e1e8;
  --paper:#f3f1f5; --card:#fff; --accent:#8c1d3f; --blue:#1b4f8a;
  --fd:'Aammu FK','Noto Sans Thaana',system-ui,sans-serif; --fw:'MV Waheed','Aammu FK','Noto Sans Thaana',sans-serif;
  --fe:'Inter',system-ui,sans-serif; --fh:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--fd);line-height:1.8}
html[lang=en] body{font-family:var(--fe);line-height:1.5}
html[lang=en] .hd{font-family:var(--fh);line-height:1.25}
html[lang=dv] h1,html[lang=dv] h2,html[lang=dv] h3,html[lang=dv] h4,html[lang=dv] .tile .t,html[lang=dv] .feat .t,html[lang=dv] .band{font-family:var(--fw);font-weight:400}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
img{display:block;width:100%;height:100%;object-fit:cover;background:#cfcbd6}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
.top{background:linear-gradient(90deg,var(--plum),var(--wine));color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{background:#fff;border-radius:10px;padding:8px 14px;line-height:0}
.logo img{height:30px;width:auto;display:block;background:none}
nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
nav a{white-space:nowrap;font-size:16px;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{border-color:#fff}
html[lang=en] nav a{font-size:14px;font-weight:500}
.lang{display:flex;border:1px solid #ffffff80;border-radius:99px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#fff;padding:5px 14px;cursor:pointer;font:inherit;font-size:14px}
.lang button[aria-pressed=true]{background:#fff;color:var(--wine);font-weight:600}
.bar{background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;height:40px}

.banner{margin:18px auto}
.banner div{height:90px;border-radius:4px;background:linear-gradient(100deg,#7cb518,#4f8a10);color:#fff;display:flex;align-items:center;justify-content:center;font:700 26px var(--fe);letter-spacing:.5px}
.banner small{display:block;text-align:center;font:11px var(--fe);color:var(--mute);margin-bottom:3px}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:center;margin:28px auto}
.hero .pic{aspect-ratio:16/10;border-radius:4px;overflow:hidden}
.kicker{display:inline-block;color:var(--mute);font-size:14px;border-inline-start:3px solid var(--accent);padding-inline-start:8px;margin-bottom:12px}
.hero h1{font-size:clamp(28px,3.6vw,44px);font-weight:700;line-height:1.55}
html[lang=en] .hero h1{line-height:1.15}
.hero p{margin-top:14px;color:var(--mute);font-size:16px;max-width:60ch}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:34px}
.tile{position:relative;aspect-ratio:1/1.05;border-radius:4px;overflow:hidden;color:#fff}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000000c0)}
.tile .t{position:absolute;inset:auto 0 0 0;padding:16px;z-index:1;font-weight:600;font-size:17px;line-height:1.7}
html[lang=en] .tile .t{line-height:1.3}
.tile img{transition:transform .4s}
.tile:hover img{transform:scale(1.04)}

/* main layout */
.main{display:grid;grid-template-columns:1fr 340px;gap:28px}
.sec-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--blue);margin:6px 0 16px}
.sec-h:before{content:"";width:5px;height:24px;background:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:4px;overflow:hidden;display:block}
.card .pic{aspect-ratio:4/3}
.card .b{padding:12px 14px 16px}
.card h3{font-size:17px;font-weight:600;line-height:1.7}
html[lang=en] .card h3{line-height:1.3}
.meta{font-size:12px;color:var(--mute);font-family:var(--fe)}
.card:hover h3,.row:hover h4{color:var(--accent)}
.stack{display:grid;gap:12px;margin-top:16px}
.stack .card{padding:14px 16px}

/* sidebar */
.side{background:var(--card);border-radius:4px;align-self:start;position:sticky;top:84px}
.side h2{padding:14px 16px;font-size:18px;color:var(--wine);border-bottom:2px solid var(--wine)}
.row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.row .th{width:82px;height:56px;flex:none;border-radius:3px;overflow:hidden}
.row h4{font-size:15px;font-weight:600;line-height:1.7}
html[lang=en] .row h4{line-height:1.3}
.more{display:block;text-align:center;padding:16px;color:var(--mute);font-size:14px}
.mini{margin:0 16px 16px;height:90px;display:grid;place-items:center;border-radius:4px;background:#e8643c;color:#fff;font:700 20px var(--fe)}

/* sections */
.band{background:#eaf0f6;display:flex;align-items:center;gap:10px;padding:12px 18px;margin:44px 0 20px;border-inline-end:5px solid var(--blue);color:var(--blue);font-weight:700;font-size:20px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.five .pic{aspect-ratio:4/3;border-radius:3px;overflow:hidden;margin-bottom:8px}
.five h3{font-size:15px;font-weight:600;line-height:1.7;margin-top:4px}
html[lang=en] .five h3{line-height:1.3}
.life{display:grid;grid-template-columns:1fr 1.1fr .9fr;gap:20px}
.life .big .pic{aspect-ratio:4/3;border-radius:3px;overflow:hidden;margin-bottom:8px}
.life .list a{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.life .list .th{width:110px;height:72px;flex:none;overflow:hidden;border-radius:3px}
.life .list h4{font-size:15px;font-weight:600;line-height:1.7}
html[lang=en] .life .list h4{line-height:1.3}
.feat{position:relative;border-radius:3px;overflow:hidden;color:#fff;min-height:320px}
.feat:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000000d0)}
.feat .t{position:absolute;inset:auto 0 0;z-index:1;padding:18px;font-weight:700;font-size:19px;line-height:1.7}
html[lang=en] .feat .t{line-height:1.3}

footer{background:#26122e;color:#cfc6d6;margin-top:56px;padding:36px 0 24px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
footer nav a{color:#cfc6d6}

@media(max-width:960px){
  .hero{grid-template-columns:1fr}.main{grid-template-columns:1fr}.side{position:static}
  .tiles{grid-template-columns:1fr 1fr}.five{grid-template-columns:1fr 1fr}.life{grid-template-columns:1fr}
  .top .wrap{flex-wrap:wrap;height:auto;padding-block:10px}
  nav{order:3;width:100%}
}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.five{grid-template-columns:1fr}.banner div{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const keys=['home','politics','national','economy','sports','life','world','tech'];
let L=(()=>{try{return localStorage.getItem('lodhi-lang')}catch(e){return null}})()||'dv';

function render(){
  const t=T[L],g=(o,k)=>o[k==='s'?'s'+L:L];
  const html=document.documentElement;html.lang=L;html.dir=L==='dv'?'rtl':'ltr';
  document.title=L==='dv'?'ލޮދި | Lodhi News':'Lodhi News';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t[e.dataset.i18n]);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  const nav=keys.map((k,i)=>`<a href="#" class="${i?'':'on'}">${t.cat[k]}</a>`).join('');
  $('#nav').innerHTML=nav;$('#fnav').innerHTML=nav;
  let d;try{d=new Date().toLocaleDateString(L==='dv'?'dv-MV':'en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){}
  $('#date').textContent=d||new Date().toDateString();

  const h=A.hero;
  $('#hero').innerHTML=`<a class="pic" href="#"><img src="${img(h.img,1000,640)}" alt="" loading="eager"></a>
   <div><span class="kicker">${t.cat[h.c]}</span><h1 class="hd"><a href="#">${h[L]}</a></h1><p>${h['s'+L]}</p></div>`;
  $('#tiles').innerHTML=A.tiles.map(a=>`<a class="tile" href="#"><img src="${img(a.img,500,520)}" alt="" loading="lazy"><div class="t">${a[L]}</div></a>`).join('');
  $('#featured').innerHTML=A.featured.map((a,i)=>`<a class="card" href="#" ${i==2?'style="grid-column:1/-1"':''}><div class="pic" ${i==2?'style="aspect-ratio:16/7"':''}><img src="${img(a.img)}" alt="" loading="lazy"></div><div class="b"><span class="meta">${t.cat[a.c]}</span><h3>${a[L]}</h3></div></a>`).join('');
  $('#stack').innerHTML=A.stack.map(a=>`<a class="card" href="#"><span class="meta">${t.cat[a.c]}</span><h3>${a[L]}</h3></a>`).join('');
  $('#latest').innerHTML=A.latest.map(a=>`<a class="row" href="#"><div class="th"><img src="${img(a.img,200,140)}" alt="" loading="lazy"></div><div><div class="meta">${t.ago(a.n,a.u)}</div><h4>${a[L]}</h4></div></a>`).join('');
  $('#sports').innerHTML=A.sports.map(a=>`<a href="#"><div class="pic"><img src="${img(a.img,500,380)}" alt="" loading="lazy"></div><span class="meta">${a.d}</span><h3>${a[L]}</h3></a>`).join('');
  const l=A.life;
  $('#life').innerHTML=`<a class="big" href="#"><div class="pic"><img src="${img(l.big.img)}" alt="" loading="lazy"></div><span class="meta">${l.big.d}</span><h3 style="font-size:17px;font-weight:600;line-height:1.6">${l.big[L]}</h3></a>
   <div class="list">${l.list.map(a=>`<a href="#"><div class="th"><img src="${img(a.img,260,170)}" alt="" loading="lazy"></div><div><h4>${a[L]}</h4><span class="meta">${a.d}</span></div></a>`).join('')}</div>
   <a class="feat" href="#"><img src="${img(l.feat.img,600,800)}" alt="" loading="lazy"><div class="t">${l.feat[L]}</div></a>`;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lodhi-lang',L)}catch(e){}render()});
render();
</script>
